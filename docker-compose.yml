services:
  mongo:
    image: mongo:7
    container_name: fashion-marketplace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: fashion-marketplace-backend
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: fashion_marketplace
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      AI_PROVIDER: sandbox
      JWT_SECRET: local-dev-jwt-secret-change-me
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fashion-marketplace-frontend
    environment:
      BROWSER: none
      HOST: 0.0.0.0
      DISABLE_ESLINT_PLUGIN: "true"
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
      REACT_APP_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: